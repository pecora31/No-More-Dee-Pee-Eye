name: Windows
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Fetch pinned engine
        shell: pwsh
        run: ./scripts/fetch-engine.ps1
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Portable build
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: NoMoreDeePeeEye-windows-x64
          path: dist/NoMoreDeePeeEye-0.1.1-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NoMoreDeePeeEye-windows-x64
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/NoMoreDeePeeEye-0.1.1-windows-x64.zip
