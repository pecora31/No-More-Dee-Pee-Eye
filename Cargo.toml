[package]
name = "no-more-dee-pee-eye"
version = "0.1.2"
edition = "2024"
rust-version = "1.90"
description = "A quiet, native Windows interface for Zapret2"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
slint = { version = "=1.14.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { version = "=0.21.3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.14.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
